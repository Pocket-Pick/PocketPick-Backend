name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      card: ${{ steps.filter.outputs.card }}
      user: ${{ steps.filter.outputs.user }}
      sale-post: ${{ steps.filter.outputs.sale-post }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth/**'
            card:
              - 'services/card/**'
            user:
              - 'services/user/**'
            sale-post:
              - 'services/sale-post/**'
            root:
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'config/**'

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile - auth
        if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:auth:compileJava

      - name: Compile - card
        if: needs.detect-changes.outputs.card == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:card:compileJava

      - name: Compile - user
        if: needs.detect-changes.outputs.user == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:user:compileJava

      - name: Compile - sale-post
        if: needs.detect-changes.outputs.sale-post == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:sale-post:compileJava

      - name: Checkstyle - auth
        if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:auth:checkstyleMain

      - name: Checkstyle - card
        if: needs.detect-changes.outputs.card == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:card:checkstyleMain

      - name: Checkstyle - user
        if: needs.detect-changes.outputs.user == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:user:checkstyleMain

      - name: Checkstyle - sale-post
        if: needs.detect-changes.outputs.sale-post == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:sale-post:checkstyleMain

      - name: Test - auth
        if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:auth:test

      - name: Test - card
        if: needs.detect-changes.outputs.card == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:card:test

      - name: Test - user
        if: needs.detect-changes.outputs.user == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:user:test

      - name: Test - sale-post
        if: needs.detect-changes.outputs.sale-post == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:sale-post:test

      - name: JaCoCo Report - auth
        if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:auth:jacocoTestReport

      - name: JaCoCo Report - card
        if: needs.detect-changes.outputs.card == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:card:jacocoTestReport

      - name: JaCoCo Report - user
        if: needs.detect-changes.outputs.user == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:user:jacocoTestReport

      - name: JaCoCo Report - sale-post
        if: needs.detect-changes.outputs.sale-post == 'true' || needs.detect-changes.outputs.root == 'true'
        run: ./gradlew :services:sale-post:jacocoTestReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/**/*.xml'
          retention-days: 7
