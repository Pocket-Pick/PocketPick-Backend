services:
  mysql:
    image: mysql:8.0
    container_name: pocketpick-card-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: pocketpick_card
    volumes:
      - pocketpick-card-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  card-service:
    build: .
    container_name: pocketpick-card-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pocketpick_card
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  pocketpick-card-mysql-data:
