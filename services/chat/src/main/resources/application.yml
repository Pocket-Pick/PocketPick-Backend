spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pocketpick_chat}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pocketpick.chat.*"

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET_NAME}
      presigned-url-expiration: PT5M

server:
  port: ${SERVER_PORT:8084}

chat:
  server:
    ip: ${CHAT_SERVER_IP:127.0.0.1}
